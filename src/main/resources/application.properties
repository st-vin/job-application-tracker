# Application name
spring.application.name=jobapplicationtracker

# Active profile (use 'dev' for development, 'prod' for production)
spring.profiles.active=dev

server.port=8080

# JWT Configuration
jwt.secret=myVerySecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmSecureRandom
jwt.expiration=86400000

# Logging
logging.level.org.alvin.jobapplicationtracker=DEBUG
logging.level.org.springframework.security=DEBUG

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Application Base URL (for email links)
app.base-url=http://localhost:8080

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=${MAIL_FROM:noreply@jobtracker.com}