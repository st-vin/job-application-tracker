# ==============================
# MariaDB Configuration (Persistent)
# ==============================
spring.datasource.url=jdbc:mariadb://localhost:3305/jobdb
spring.datasource.username=root
spring.datasource.password=2248
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ==============================
# JPA / Hibernate Configuration
# ==============================
# Recommended for production: keep schema stable
spring.jpa.hibernate.ddl-auto=update

# Use the MariaDB dialect
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Optional but helpful in dev/staging (disable in real prod)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# Connection Pool (Optional but Smart)
# ==============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# ==============================
# Logging
# ==============================
logging.level.root=INFO
logging.level.org.alvin.jobapplicationtracker=DEBUG
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.web=INFO
